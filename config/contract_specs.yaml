# CME Treasury futures used by the futures layer (CLAUDE.md 7.9, section 15).
# Source: CME Globex security definitions as published in Databento GLBX.MDP3, `definition` schema (fields
# unit_of_measure_qty = face value, min_price_increment = tick in price points), read from the one-day snapshots in
# data/cache/databento/definition/ (pulled 2026-10-03, first weekday of each month 2010-06 to 2024-09).
# point_value_usd = face / 100 ($ per 1.00 price point); tick_value_usd = tick_size x point_value_usd.
# The code takes the tick size point in time from the definitions and checks point_value_usd against this file.
# The CME product pages (cmegroup.com contract specs) could not be fetched from this machine (timeout / HTTP 403 on
# 2026-10-03), so they are not cited as checked.
